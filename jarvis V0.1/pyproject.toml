[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Local AI desktop assistant foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.4",
  "httpx>=0.27.0",
  "playwright>=1.46.0",
  "pywinauto>=0.6.8",
  "pyautogui>=0.9.54",
  "Pillow>=10.4.0",
  "spotipy>=2.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.1",
  "mypy>=1.11.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.setuptools]
packages = ["jarvis", "jarvis.core", "jarvis.skills", "jarvis.skills.browser", "jarvis.skills.computer", "jarvis.skills.media", "jarvis.skills.spotify", "jarvis.skills.system", "jarvis.vision", "jarvis.voice", "jarvis.memory", "jarvis.utils"]
